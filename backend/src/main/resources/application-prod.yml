# ─────────────────────────────────────────────────────────────────────────────
# Prodüksiyon profili – tüm hassas değerler environment variable'dan gelir.
# Bu dosyayı Git'e commit etmek güvenlidir.
# ─────────────────────────────────────────────────────────────────────────────
spring:
  application:
    name: borsa

  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/borsa_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update            # Tabloları Hibernate oluştursun (Flyway sorunu çözülünce değiştirilecek)
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false                # Flyway Spring Boot 4 uyumluluk sorunu — devre dışı

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  remember-me-refresh-expiration: ${JWT_REMEMBER_ME_REFRESH_EXPIRATION:2592000000}

encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY}

exchange:
  # Varsayılan mainnet (false) — Dokploy'da BINANCE_USE_SANDBOX=true set
  # edilirse Binance "Demo Trading" hesabındaki key'ler kullanılabilir
  # (bkz. BinanceExchangeClient.spotBaseUrl/futuresBaseUrl).
  binance:
    use-sandbox: ${BINANCE_USE_SANDBOX:false}
  bybit:
    use-testnet: ${BYBIT_USE_TESTNET:false}
  okx:
    use-sandbox: ${OKX_USE_SANDBOX:false}
  bingx:
    use-sandbox: ${BINGX_USE_SANDBOX:false}
